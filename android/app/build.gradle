plugins { id 'com.android.application' }

android {
    namespace 'in.bowei.webapps.shell'
    compileSdk 37
    defaultConfig {
        applicationId = project.findProperty('sitePackage') ?: 'in.bowei.webapps.example'
        minSdk 26
        targetSdk 36
        versionCode = (project.findProperty('siteVersion') ?: '1').toInteger()
        versionName = "1.${project.findProperty('siteVersion') ?: '1'}"
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('APK_KEYSTORE') ?: '/tmp/missing.jks')
            storePassword System.getenv('APK_KEYSTORE_PASSWORD')
            keyAlias 'webapps'
            keyPassword System.getenv('APK_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation('org.mozilla.geckoview:geckoview-arm64-v8a:159.0.20261102144711') {
        // This version ships no proprietary Google runtime. Passkeys are disabled
        // in the runtime configuration until an open-source provider is wired up.
        exclude group: 'com.google.android.gms'
        exclude group: 'com.google.firebase'
    }
}
